<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6200ea">
    <title>Super Lista - Sin conexion</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f7;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .material-icons { font-size: 72px; color: #6200ea; opacity: 0.5; margin-bottom: 24px; }
        h1 { font-size: 1.5rem; margin-bottom: 8px; }
        p { color: #6b7280; margin-bottom: 24px; font-size: 0.95rem; }
        button {
            background: #6200ea; color: white; border: none; padding: 12px 32px;
            border-radius: 8px; font-size: 1rem; cursor: pointer;
            font-family: inherit;
        }
        button:hover { background: #7c4dff; }
    </style>
</head>
<body>
    <i class="material-icons">wifi_off</i>
    <h1>Sin conexion</h1>
    <p>No se pudo cargar la pagina. Verifica tu conexion a internet e intenta de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
</body>
</html>
