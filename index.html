<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6200ea">
    <meta name="description" content="Super Lista - Tu lista de compras inteligente">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Super Lista</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icons/icon-192x192.png">
</head>

<body>

    <header>
        <div class="header-content">
            <div class="header-left">
                <i class="material-icons header-icon">shopping_cart</i>
                <h1>Super Lista</h1>
            </div>
            <div class="header-search" id="search-container">
                <button class="icon-btn" id="btn-search" aria-label="Buscar">
                    <i class="material-icons">search</i>
                </button>
                <input type="text" id="txt-busqueda" placeholder="Buscar producto..." autocomplete="off">
            </div>
        </div>
    </header>

    <main>
        <section class="input-section">
            <div class="input-row">
                <div class="input-field">
                    <input type="text" id="ingreso-producto" placeholder="Agregar producto..." autocomplete="off">
                </div>
                <button id="btn-entrada-producto" class="fab-btn" aria-label="Agregar producto">
                    <i class="material-icons">add</i>
                </button>
            </div>
        </section>

        <section class="list-header" id="list-header">
            <div class="list-header-row">
                <span class="col-icon"></span>
                <span class="col-name">Producto</span>
                <span class="col-qty">Cant.</span>
                <span class="col-price">Precio</span>
                <span class="col-subtotal">Subtotal</span>
                <span class="col-action"></span>
            </div>
        </section>

        <section id="lista">
            <ul id="ul-lista"></ul>
        </section>

        <section class="empty-state" id="empty-state">
            <i class="material-icons">receipt_long</i>
            <p>Tu lista esta vacia</p>
            <span>Agrega productos para comenzar</span>
        </section>

        <section class="total-section" id="total-section">
            <div class="total-row">
                <span class="total-label">Total estimado</span>
                <span class="total-value" id="total-valor">$0.00</span>
            </div>
            <div class="total-items">
                <span id="total-items-count">0 productos</span>
            </div>
        </section>

        <div class="actions-bar" id="actions-bar">
            <button id="btn-borrar-productos" class="btn-clear">
                <i class="material-icons">delete_sweep</i>
                Borrar Todo
            </button>
        </div>
    </main>

    <script src="js/main.js"></script>

</body>

</html>
